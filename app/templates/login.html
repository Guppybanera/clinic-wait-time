{% extends "base.html" %}
{% block title %}Staff sign in{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
<h1>Staff sign in</h1>
{% if locked %}<p class="banner">Locked after inactivity. Sign in again.</p>{% endif %}
{% if error %}<p class="flash error">{{ error }}</p>{% endif %}
<form method="post" action="/staff/login">
<input type="hidden" name="next" value="{{ next }}">
<p><label>Username<br><input name="username" autocomplete="username" autofocus required style="width:100%"></label></p>
<p><label>Password<br><input name="password" type="password" autocomplete="current-password" required style="width:100%"></label></p>
<p><button style="width:100%">Sign in</button></p>
</form>
</div>
{% endblock %}
